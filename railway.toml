# Railway deploys the whole repository: the backend reads the hospital
# directory from data/hospitals and serves the ambulance web app from app/www.
[build]
buildCommand = "npm --prefix backend ci --omit=dev"

[deploy]
startCommand = "npm --prefix backend start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
