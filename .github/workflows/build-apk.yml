name: Build GoldenHour APK

# Builds the installable Android APK in GitHub's cloud.
# No Android Studio, no local SDK, no Java install.
#
#   Actions tab → "Build GoldenHour APK" → Run workflow
#   → fill in the server address → wait ~4 minutes
#   → download the "goldenhour-apk" artifact, unzip, copy to a phone, install
#
# This workflow is deliberately INDEPENDENT of the test workflow. On demo day
# you want an APK even if a test is red.

on:
  workflow_dispatch:
    inputs:
      server_base:
        description: 'Backend address to bake into the APK, e.g. http://192.168.1.100:5000 (leave blank to use app/www/config.js as committed)'
        required: false
        default: ''
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Saves you from shipping an APK that points at nothing. Skipped when the
      # box is left blank, in which case whatever is committed in config.js wins.
      - name: Bake the backend address into the app
        if: inputs.server_base != ''
        run: |
          node -e "
            const fs = require('fs');
            const file = 'app/www/config.js';
            const base = process.env.SERVER_BASE.replace(/\/+$/, '');
            const src = fs.readFileSync(file, 'utf8');
            const out = src.replace(/SERVER_BASE:\s*\"[^\"]*\"/, 'SERVER_BASE: \"' + base + '\"');
            if (out === src) { console.error('Could not find SERVER_BASE in ' + file); process.exit(1); }
            fs.writeFileSync(file, out);
            console.log('SERVER_BASE = ' + base);
          "
        env:
          SERVER_BASE: ${{ inputs.server_base }}

      - name: Show the server the APK will talk to
        run: grep -n 'SERVER_BASE' app/www/config.js

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Copy the web app into the Android project
        working-directory: app
        run: npx cap sync android

      - name: Gradle build
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # A release build without signing keys produces app-release-unsigned.apk,
      # which a phone will refuse to install. Debug is what you want for a
      # hackathon; this just makes the failure legible if someone picks release.
      - name: Locate the APK
        id: find
        run: |
          APK=$(find app/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goldenhour-apk
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 30
