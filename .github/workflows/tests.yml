name: Tests

# Runs on every push. Kept separate from the APK build on purpose: a red test
# should never stop you producing an APK five minutes before a demo.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Ambulance app · 90 unit + 80 functional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm test

  backend:
    name: Backend · broadcast end-to-end + desk auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm test
