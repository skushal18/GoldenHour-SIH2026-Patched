# GoldenHour — replaces the platform's default proxy location so Socket.IO's
# WebSocket upgrade is passed through explicitly (not only long-polling).
location / {
    proxy_pass          http://127.0.0.1:8080;
    proxy_http_version  1.1;

    proxy_set_header    Upgrade             $http_upgrade;
    proxy_set_header    Connection          $gh_connection_upgrade;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   https;

    # Socket.IO pings every 25 s; keep idle sockets well past that.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
    proxy_buffering     off;
}
