# GoldenHour — http-level nginx settings on the Elastic Beanstalk instance.
# A case can carry four compressed photos; the app accepts 12 MB.
client_max_body_size 13m;

# WebSocket upgrade for Socket.IO (used by elasticbeanstalk/00_application.conf).
map $http_upgrade $gh_connection_upgrade {
    default upgrade;
    ''      '';
}
